version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: iprn
      POSTGRES_PASSWORD: iprn
      POSTGRES_DB: iprn
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://iprn:iprn@db:5432/iprn
    depends_on:
      - db
    ports:
      - "3000:3000"

  message-processor:
    build:
      context: ../message-processor
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://iprn:iprn@db:5432/iprn
    depends_on:
      - db

volumes:
  db_data: {}